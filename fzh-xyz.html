<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>fzh.xyz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --bg:        #07070a;
      --ink:       #f0ece4;
      --ink-mid:   rgba(240,236,228,0.62);
      --ink-dim:   rgba(240,236,228,0.35);
      --rule:      rgba(240,236,228,0.10);
      --glow:      #e8a35c;   /* warm sodium-lamp amber */
      --glow-dim:  rgba(232,163,92,0.16);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }

    #rain-back, #rain-front {
      position: fixed; inset: 0;
      z-index: 0; pointer-events: none;
    }
    #rain-back { opacity: 0.55; filter: blur(0.4px); }

    /* warm light source washing up behind the wordmark — signature element */
    .glow {
      position: fixed;
      left: -10%;
      bottom: -25%;
      width: 70vw; height: 70vw;
      max-width: 900px; max-height: 900px;
      background: radial-gradient(circle, var(--glow-dim) 0%, rgba(232,163,92,0.05) 40%, transparent 70%);
      z-index: 0; pointer-events: none;
      animation: breathe 9s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.08); }
    }

    /* vignette for cinematic framing */
    .vignette {
      position: fixed; inset: 0;
      z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
    }

    /* grain overlay */
    body::after {
      content: '';
      position: fixed; inset: 0;
      z-index: 3; pointer-events: none;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px;
    }

    .scene {
      position: relative; z-index: 4;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      flex-shrink: 0;
      padding: clamp(16px,2.2vh,28px) clamp(18px,3vw,36px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-links { display: flex; gap: clamp(14px,2.4vw,30px); }

    nav a {
      font-size: clamp(10px,1vw,12px);
      color: var(--ink-mid);
      text-decoration: none;
      letter-spacing: 0.01em;
      position: relative;
      transition: color 0.35s;
    }
    nav a::after {
      content: '';
      position: absolute; bottom: -3px; left: 0;
      width: 0; height: 0.5px;
      background: var(--glow);
      box-shadow: 0 0 6px var(--glow-dim);
      transition: width 0.45s cubic-bezier(0.22,1,0.36,1);
    }
    nav a:hover { color: var(--ink); }
    nav a:hover::after { width: 100%; }

    .nav-tag {
      font-style: italic;
      font-size: clamp(9px,0.85vw,10px);
      letter-spacing: 0.1em;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    /* ── RULE ── */
    .hr-rule {
      flex-shrink: 0;
      width: calc(100% - clamp(36px,6vw,72px));
      margin: 0 auto;
      height: 0.5px;
      background: linear-gradient(to right, transparent, rgba(240,236,228,0.18) 15%, rgba(240,236,228,0.18) 85%, transparent);
    }

    /* ── MAIN ── */
    main {
      flex: 1; min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 0 clamp(18px,3vw,36px) 0 clamp(16px,2.8vw,34px);
      position: relative;
    }

    .side-label {
      position: absolute;
      right: clamp(18px,3vw,36px);
      bottom: clamp(54px,7vh,80px);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      font-style: italic;
      font-size: clamp(9px,0.8vw,10px);
      letter-spacing: 0.14em;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    /* ── TEXT GROUP ── */
    .text-group { width: 100%; }

    .eyebrow {
      font-style: italic;
      font-size: clamp(12px,1.4vw,17px);
      color: var(--ink);
      opacity: 0.42;
      letter-spacing: 0.02em;
      display: block;
      margin-bottom: clamp(4px,0.8vw,10px);
    }

    .wordmark {
      font-weight: 500;
      font-size: clamp(11vw,13.5vw,15vw);
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--ink);
      display: block;
      text-shadow:
        0 0 22px rgba(232,163,92,0.20),
        0 0 60px rgba(232,163,92,0.08);
      animation: flicker-in 2.1s ease-out both;
    }

    @keyframes flicker-in {
      0%   { opacity: 0; }
      6%   { opacity: 1; }
      8%   { opacity: 0.2; }
      11%  { opacity: 1; }
      14%  { opacity: 0.3; }
      18%  { opacity: 1; }
      100% { opacity: 1; }
    }

    .accent {
      color: var(--glow);
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      flex-shrink: 0;
      padding: clamp(10px,1.4vh,16px) clamp(18px,3vw,36px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 0.5px solid var(--rule);
    }

    .bottom-bar span {
      font-style: italic;
      font-size: clamp(9px,0.85vw,10px);
      letter-spacing: 0.1em;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    .dot-row { display: flex; gap: 5px; align-items: center; }
    .dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--glow);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 0.9; }
    }

    /* ── FADE IN ── */
    .scene > * { animation: rise 1s cubic-bezier(0.22,1,0.36,1) both; }
    nav         { animation-delay: 0.08s; }
    .hr-rule    { animation-delay: 0.18s; }
    main        { animation-delay: 0.32s; }
    .bottom-bar { animation-delay: 0.46s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<canvas id="rain-back"></canvas>
<canvas id="rain-front"></canvas>
<div class="glow"></div>
<div class="vignette"></div>

<div class="scene">

  <nav>
    <div class="nav-links">
      <a href="#">itslyfe</a>
      <a href="#">betterlyfe</a>
      <a href="#">things&amp;tools</a>
      <a href="#">sholat</a>
    </div>
    <div class="nav-tag">since 2024</div>
  </nav>

  <div class="hr-rule"></div>

  <main>
    <div class="side-label">personal log</div>
    <div class="text-group">
      <span class="eyebrow">you are visiting</span>
      <span class="wordmark">fzh<span class="accent">.xyz</span></span>
    </div>
  </main>

  <div class="bottom-bar">
    <span>life, tools &amp; notes</span>
    <div class="dot-row">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <span>@fzh</span>
  </div>

</div>

<script>
  const backCanvas  = document.getElementById('rain-back');
  const frontCanvas = document.getElementById('rain-front');
  const backCtx  = backCanvas.getContext('2d');
  const frontCtx = frontCanvas.getContext('2d');

  let W, H;
  let backDrops = [], frontDrops = [];
  let ripples = [];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    [backCanvas, frontCanvas].forEach(c => { c.width = W; c.height = H; });
  }

  function spawnDrop(layer) {
    const isFront = layer === 'front';
    return {
      x:       Math.random() * W,
      y:       Math.random() * -H,
      len:     isFront ? Math.random() * 16 + 10 : Math.random() * 9 + 5,
      speed:   isFront ? Math.random() * 2.6 + 1.6 : Math.random() * 1.2 + 0.6,
      opacity: isFront ? Math.random() * 0.34 + 0.16 : Math.random() * 0.20 + 0.08,
      w:       isFront ? (Math.random() < 0.5 ? 0.6 : 0.95) : 0.5
    };
  }

  function init() {
    resize();
    backDrops = []; frontDrops = [];
    const backCount  = Math.floor((W * H) / 9000);
    const frontCount = Math.floor((W * H) / 4200);
    for (let i = 0; i < backCount; i++)  { const d = spawnDrop('back');  d.y = Math.random() * H; backDrops.push(d); }
    for (let i = 0; i < frontCount; i++) { const d = spawnDrop('front'); d.y = Math.random() * H; frontDrops.push(d); }
  }

  function drawLayer(ctx, drops, layer) {
    ctx.clearRect(0, 0, W, H);
    for (const d of drops) {
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 0.5, d.y + d.len);
      ctx.strokeStyle = `rgba(210, 200, 188, ${d.opacity})`;
      ctx.lineWidth = d.w;
      ctx.lineCap = 'round';
      ctx.stroke();
      d.y += d.speed;
      if (d.y - d.len > H) Object.assign(d, spawnDrop(layer));
    }
  }

  function drawRipples() {
    frontCtx.save();
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      frontCtx.beginPath();
      frontCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      frontCtx.strokeStyle = `rgba(232, 163, 92, ${r.opacity})`;
      frontCtx.lineWidth = 1;
      frontCtx.stroke();
      r.radius += 1.6;
      r.opacity -= 0.018;
      if (r.opacity <= 0) ripples.splice(i, 1);
    }
    frontCtx.restore();
  }

  function draw() {
    drawLayer(backCtx, backDrops, 'back');
    drawLayer(frontCtx, frontDrops, 'front');
    if (ripples.length) drawRipples();
    requestAnimationFrame(draw);
  }

  function addRipple(x, y) {
    if (ripples.length > 12) ripples.shift();
    ripples.push({ x, y, radius: 2, opacity: 0.5 });
  }

  window.addEventListener('resize', init);
  window.addEventListener('pointerdown', (e) => addRipple(e.clientX, e.clientY));

  init();
  draw();
</script>

</body>
</html>
